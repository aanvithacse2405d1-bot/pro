<!DOCTYPE html>
<html>
    <head>
        <title>Registration Page</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background-color: #f2f2f2;
                margin: 0;
                padding: 0;
            }

            h1 {
                text-align: center;
                margin-top: 50px;
            }

            form {
                width: 300px;
                margin: 0 auto;
                background-color: #fff;
                padding: 20px;
                border-radius: 5px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            }

            label {
                display: block;
                margin-bottom: 5px;
            }

            input[type="text"],
            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 8px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            input[type="submit"] {
                width: 100%;
                padding: 10px;
                background-color: #4CAF50;
                color: white;
                border: none;
                border-radius: 4px;
                cursor: pointer;
            }

            input[type="submit"]:hover {
                background-color: #45a049;
            }
            .error {
                color: red;
                font-size: 12px;
                margin-top: 5px;
            }
        </style>
        <script>
            function validateForm() {
                let firstname = document.getElementById("firstname").value;
                let lastname = document.getElementById("lastname").value;
                let rollno = document.getElementById("rollno").value;
                let dob = document.getElementById("dob").value;
                let email = document.getElementById("email").value;
                let password = document.getElementById("password").value;
                let confirm_password = document.getElementById("confirm_password").value;
                let number = document.getElementById("number").value;
                let errorMessage = "";
                if (!lastname || !firstname || !rollno || !dob || !email || !password || !confirm_password || !number) {
                    errorMessage += "All fields are required.\n";
                }

                if (lastname.length < 3) {
                    errorMessage += "Last name must be at least 3 characters long.\n";
                }

                if (firstname.length < 3) {
                    errorMessage += "First name must be at least 3 characters long.\n";
                }

                if (!email.includes("@")) {
                    errorMessage += "Please enter a valid email address.\n";
                }

                if (password.length < 6) {
                    errorMessage += "Password must be at least 6 characters long.\n";
                }

                if (password !== confirm_password) {
                    errorMessage += "Passwords do not match.\n";
                }

                if ( number.length < 10) {
                    errorMessage += "Phone number must be at least 10 digits long.\n";
                }

                if (errorMessage) {
                    alert(errorMessage);
                    return false;
                }
                return true;
            }
        </script>
    </head>
    <body>
        <h1>Student Registration Page</h1>
        <form onsubmit="return validateForm()">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" required>

            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname" name="lastname" required>

            <label for="rollno">Roll Number:</label>
            <input type="text" id="rollno" name="rollno" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required>


            <div class="mb-3">
                <label for="event" class="form-label">Gender</label>
                <select class="form-control" id="event">
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <label for="number">Phone Number:</label>
            <input type="text" id="number" name="number" required>  

            <input type="submit" value="Register">
            <p>this is index.html</p>
        </form>
</html>
